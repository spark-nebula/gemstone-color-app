<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8f5f1">
<title>宝石カラー</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f8f5f1;color:#393043;font-family:-apple-system,BlinkMacSystemFont,sans-serif}main{min-height:100vh;min-height:100svh;padding: max(32px,env(safe-area-inset-top)) 24px max(32px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.eyebrow{font-size:11px;letter-spacing:.24em;color:#89798e}h1{font-size:32px;letter-spacing:.08em;margin:16px 0}p{font-size:14px;line-height:1.9;color:#827786}.stage{position:relative;display:grid;place-items:center;width:min(100%,360px);height:280px}.stage:before{content:"";position:absolute;width:235px;height:235px;border-radius:50%;background:#fffdfa}svg{position:relative;width:230px;height:220px;--gem:#dc3655;filter:drop-shadow(0 15px 12px #39203922)}.facet{fill:var(--gem);transition:fill .3s}#status{font-size:18px;font-weight:600;color:#393043;margin:12px 0 26px}button{width:min(100%,300px);min-height:58px;border:0;border-radius:18px;background:#393043;color:white;font:inherit;font-weight:600;cursor:pointer;touch-action:manipulation;box-shadow:0 8px 20px #39304320}button:active{transform:translateY(2px)}button:focus-visible{outline:3px solid #9680b8;outline-offset:5px}.sequence{display:flex;gap:16px;margin:24px 0;font-size:12px;color:#827786}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}footer{font-size:11px;letter-spacing:.12em;color:#9c909f;margin-top:20px}@media(prefers-reduced-motion:reduce){.facet{transition:none}}
</style>
<main>
<div class="eyebrow">A LITTLE MOMENT OF COLOR</div>
<h1>宝石カラー</h1>
<p>タップするたび、きらめく色に。<br>お気に入りの宝石を見つけよう。</p>
<div class="stage">
<svg id="gem" viewBox="0 0 240 220" role="img" aria-label="赤い宝石">
<path class="facet" d="M55 30H185L225 85 120 205 15 85Z"/>
<path d="M55 30 85 85H15Z" fill="white" opacity=".34"/>
<path d="M55 30H185L155 85H85Z" fill="white" opacity=".55"/>
<path d="M185 30 225 85H155Z" fill="white" opacity=".19"/>
<path d="M15 85H85L120 205Z" opacity=".10"/>
<path d="M85 85H155L120 205Z" fill="white" opacity=".12"/>
<path d="M155 85H225L120 205Z" opacity=".24"/>
<path d="M15 85H225" stroke="white" stroke-opacity=".4"/>
<path d="M204 15V29M197 22H211M30 126V136M25 131H35" stroke="#bcaa87" stroke-width="2" stroke-linecap="round"/>
</svg>
</div>
<p id="status" role="status" aria-live="polite" aria-atomic="true">赤い宝石</p>
<button id="change-color" type="button">色を変える <span aria-hidden="true">↻</span></button>
<div class="sequence" aria-label="赤、青、緑の順に変わります"><span><i class="dot" style="background:#dc3655"></i>赤</span><span aria-hidden="true">→</span><span><i class="dot" style="background:#3778df"></i>青</span><span aria-hidden="true">→</span><span><i class="dot" style="background:#20946e"></i>緑</span></div>
<footer>ひと粒の、いろあそび。</footer>
</main>
<script>
const colors = [
  { name: '赤い宝石', hex: '#dc3655' },
  { name: '青い宝石', hex: '#3778df' },
  { name: '緑の宝石', hex: '#20946e' }
];
let colorIndex = 0;
document.getElementById('change-color').addEventListener('click', () => {
  colorIndex = (colorIndex + 1) % colors.length;
  const color = colors[colorIndex];
  const gem = document.getElementById('gem');
  gem.style.setProperty('--gem', color.hex);
  gem.setAttribute('aria-label', color.name);
  document.getElementById('status').textContent = color.name;
});
</script>
</html>
